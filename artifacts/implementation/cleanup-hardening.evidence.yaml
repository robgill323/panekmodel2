evidence_bundle:
  artifact: src/panekmodel2/server/jobs.py
  produced_by: developer
  worktree_ref: feature/cleanup-hardening@3109e68
  items:
    - id: E-1
      kind: test-run
      cmd: '.venv/bin/python -m pytest tests -m "not slow"'
      expect: {exit: 0}
      cwd: "."

    - id: E-2
      kind: test-run
      cmd: '.venv/bin/python -m pytest tests -m slow -p no:randomly'
      expect: {exit: 0}
      cwd: "."

    - id: E-3
      kind: file-exists
      paths:
        - artifacts/implementation/smoke-run-2026-09-10.md
        - tests/test_server.py
        - tests/test_pipeline.py
        - tests/conftest.py

    - id: E-4
      kind: citation
      ref: "src/panekmodel2/logging_redaction.py:45"
      # RedactingLogRecord — SEC-003. Scrubs the RENDERED message for every
      # record from this package, so the fix covers log sites that do not
      # exist yet rather than the two that happen to exist today.

    - id: E-14
      kind: test-run
      cmd: '.venv/bin/python -m pytest tests/test_logging_redaction.py -p no:randomly'
      expect: {exit: 0}
      cwd: "."
      # Drives the real logging machinery on four package loggers and asserts
      # the key is absent from the CAPTURED OUTPUT, not that a helper exists.

    - id: E-5
      kind: citation
      ref: "src/panekmodel2/server/exports.py:25"
      # sanitize_cell — A-5. Transcript text is uploader-controlled and every
      # export is meant to be opened in a spreadsheet.

    - id: E-6
      kind: citation
      ref: "src/panekmodel2/server/jobs.py:47"
      # reset_pipeline_lock — A-11. A test dying while holding the lock hung
      # every later job-starting test instead of failing one.

    - id: E-7
      kind: citation
      ref: "src/panekmodel2/server/static/app.js:1588"
      # mountPlayer destroys the previous player — A-2. render() replaces
      # #screen.innerHTML, detaching the iframe, so every re-render of the
      # video page orphaned a player that kept its timers and network activity.

    - id: E-8
      kind: human-attested
      claim: "De-bloat verified by physical removal, not just manifest edits: streamlit, plotly, pytube, google-auth-oauthlib and srt were pip-uninstalled from the venv, after which panekmodel2.cli, panekmodel2.transcript_fetcher and server.app all still import and the full suite still passes. src/panekmodel2/ui_app.py is deleted; no OAuth code path, credentials setting or token file remains, which removes SEC-002 by construction rather than by policy."

    - id: E-9
      kind: human-attested
      claim: "Both hardening fixes were mutation-tested at three levels, not merely asserted. (1) Removing the central CSV guard fails 14 tests. (2) Narrowing the guard to chunk text only - the exact partial fix the reviewer warned would pass a naive test and still ship the hole - still fails 8 tests, so a partial fix cannot read as green here. (3) Making RedactingLogRecord.getMessage a pass-through fails 6 tests, with the API key visible verbatim in captured output. All pass on restore."

    - id: E-15
      kind: human-attested
      claim: "The A-5 surface was measured, not assumed. A probe of all five formula triggers through every column of every export finds zero live injections and confirms the guard covers 9 export/column pairs - the 8 the reviewer enumerated plus video/topic_label_1, a generated per-topic column. The guard sits at the single CSV-writing choke point, so columns added later are covered by construction; a test pins the covered set so a regression is loud. Numeric cells are deliberately untouched, since a negative valence legitimately starts with a minus sign and must stay numeric."

    - id: E-16
      kind: human-attested
      claim: "SEC-003's two sites were both verified, and the design was corrected after testing disproved the first attempt. The OAuth captions raise site is GONE - grepping transcript_fetcher.py for 'Captions list failed' and 'HttpError' returns nothing, because the tier was deleted rather than left with a redaction TODO. The surviving metadata site in pipeline.py is covered, along with the yt-dlp fallback warning and two other logger.warning(..., exc) sites. The first implementation was a logging.Filter on the package logger; a test proved filters do not apply to records propagating from child loggers such as panekmodel2.pipeline, so it would have been a false fix, and it also broke percent-interpolation by redacting the format string. Replaced with a log-record factory that redacts the rendered message, verified across four package loggers with third-party logging left untouched."

    - id: E-17
      kind: human-attested
      claim: "The parked branch f85b58b is folded in rather than discarded: its forced-interleaving B-1 regression test (events instead of sleeps) is restored verbatim, and its thread-drain teardown is superseded by the A-11 fixture, which additionally asserts the pipeline lock was not left held. The branch is deleted. Its origin story is worth carrying: leaked daemon job threads from one test wrote the disk cache after a later test's Path.home patch was undone, which manufactured a PHANTOM CSV quoting failure in the exact area under review. to_csv was verified correct against adversarial text before anything was changed - the defect was test isolation, not the exporter."

    - id: E-10
      kind: human-attested
      claim: "E-14 is closed by a real end-to-end run recorded in artifacts/implementation/smoke-run-2026-09-10.md - real weights, two real YouTube videos plus one deliberately invalid URL, through the server API. 625 chunks, 9 coherent topics, 324.6 s wall clock, all three CSV exports downloaded and parsed. It also settled two previously-assumed claims: the 3-class default genuinely emits neutral on real speech (model_produces_neutral=True), and outlier reassignment genuinely fires on real data (68 chunks), which the prior bundle could only record as an assumption because HDBSCAN produced no outliers on any synthetic corpus."

    - id: E-11
      kind: fixture-provenance
      fixture: tests/conftest.py
      synthetic: true
      # FakeRunner stubs fetch/embed/sentiment/topic-fit only. Cache I/O,
      # batching, per-URL outcomes, chunk-index rebasing and topic_dataframe()
      # run the real code. No network, no model weights in the default suite.

    - id: E-12
      kind: assumed
      claim: "The smoke run's timings come from one machine, one run, two videos. No claim is made about throughput at the batch sizes this project ultimately intends, and the Whisper audio fallback was never exercised because no test video lacked captions in a way Whisper could recover."

    - id: E-13
      kind: assumed
      claim: "The A-2 player-leak fix and the A-8 axis-text fix are verified by code inspection and by the page rendering correctly, not by an automated browser test - there is no JS test harness in this project, so no test would fail if either regressed."
