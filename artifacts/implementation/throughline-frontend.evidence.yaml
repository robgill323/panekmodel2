    - id: E-22
      kind: citation
      ref: "src/panekmodel2/server/jobs.py:40"
      # _PIPELINE_LOCK — one pipeline execution at a time per process. Review
      # blocker B-1: concurrent fits corrupt the shared TopicModeler, and a
      # second job's fit relabelled the first job's topics.

    - id: E-23
      kind: citation
      ref: "src/panekmodel2/pipeline.py:142"
      # MultiRunResult.keywords — captured during the run's own fit, so jobs.py
      # never reads topic labels back off the shared runner (B-1, part two).

    - id: E-24
      kind: citation
      ref: "src/panekmodel2/server/static/app.js:17"
      # The SPA's settings object deliberately omits chunk_max_words. Review
      # blocker B-2: posting a concrete 200 suppressed the server-side
      # derivation, so a 120 s selection produced ~77 s chunks.

    - id: E-25
      kind: human-attested
      claim: "The B-1 regression test was verified to have teeth: with both fixes reverted (keyword read-back restored AND the serialization lock neutralised) tests/test_server.py::test_concurrent_jobs_keep_their_own_topic_labels fails with the reviewer's exact symptom - job A's keywords describing job B's corpus. With the lock alone restored it passes, so the test was checked against the fully-reverted original rather than a partial revert. B-2 was verified end to end against a running server: a real SPA-shaped payload with chunk_max_seconds=120 resolves to chunk_max_words=500, not 200."

    - id: E-11
      kind: fixture-provenance
      fixture: tests/conftest.py
      synthetic: true
      # FakeRunner stubs only fetch/embed/sentiment/topic-fit. Cache I/O,
      # batching, per-URL outcome bookkeeping, chunk-index rebasing AND
      # topic_dataframe() run the real code — the hand-rolled dataframe stub
      # that hid the `reassigned` column from every test (review A-4) is gone.
      # No network and no model weights in the default suite.

    - id: E-12
      kind: human-attested
      claim: "Every screen was rendered in headless Chrome against a live server and inspected - New run, Batch overview, Topics, Topic sentiment (light and dark), Video page, Export, and the outlier inspector. The full-size Throughline (topic lane + sentiment ribbon, time axis, plus/minus 1 markers) and the micro-throughlines in the video list draw from real chunk data; the YouTube iframe embed loads and the three CSV exports download with correct headers. After the design addendum, the Topics excerpt toggle was confirmed to reorder quote cards by assignment probability rather than by absolute sentiment, and the outlier inspector was confirmed to list every unclustered chunk with a working per-video filter and click-through to the cued video."

    - id: E-13
      kind: assumed
      claim: "Google Fonts (Source Serif 4, IBM Plex Sans/Mono) load over the network. They are not vendored; offline the page falls back to the Georgia / system-ui / ui-monospace stacks declared in styles.css, which was not verified with the network disabled."

    - id: E-14
      kind: assumed
      claim: "The end-to-end path was exercised with the transcript fetch, embedding and sentiment stages stubbed. No run against live YouTube transcripts with the real embedding/sentiment weights was performed, so real-transcript topic quality and true wall-clock run times are unverified."

    - id: E-19
      kind: assumed
      claim: "HDBSCAN produced no outlier chunks on any small synthetic corpus tried, so reduce_outliers never actually fired end-to-end here. The reassignment flag logic is covered directly by unit tests over mark_reassigned(), and the slow integration test asserts only the invariants that hold either way. An observed real reassignment on a live transcript batch remains unverified."

    - id: E-20
      kind: test-run
      cmd: '.venv/bin/python -m pytest tests/test_sentiment.py -m slow -p no:randomly'
      expect: {exit: 0}
      cwd: "."
      # Resolves the new default model's config from the HF Hub and asserts its
      # id2label is exactly {negative, neutral, positive} - the labels
      # normalize_sentiment maps. Verified: no inference weights needed.

    - id: E-21
      kind: assumed
      claim: "The default sentiment model's weights were never downloaded and no inference was run against it, so only its declared label set is verified - not its scores on real transcript text."
