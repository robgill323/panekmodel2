evidence_bundle:
  artifact: docs/DEPLOYMENT.md
  produced_by: developer
  worktree_ref: feature/packaging-baseline-2@82859e0
  # Branch note: the dead agent's worktree still has feature/packaging-baseline
  # checked out (at ce23bb7), so git will not move that ref from here. This
  # branch is ce23bb7 replayed onto main@087b444 (clean, as 0557ccf) plus the
  # packaging commit 82859e0.
  items:
    - id: E-1
      kind: test-run
      cmd: '.venv/bin/python -m pytest tests -m "not slow"'
      expect: {exit: 0}
      cwd: "."
      # In the capturing worktree, .venv was built ONLY from
      # requirements-dev.lock (see E-11). 548 passed, 8 slow deselected.

    - id: E-2
      kind: test-run
      cmd: '.venv/bin/python -m pytest tests/test_auth.py -p no:randomly'
      expect: {exit: 0}
      cwd: "."
      # The gate, the bind refusal and their leak paths: 132 tests.

    - id: E-3
      kind: test-run
      cmd: '.venv/bin/python -m pytest tests/test_packaging.py -p no:randomly'
      expect: {exit: 0}
      cwd: "."
      # Static Dockerfile/compose/lock/runbook invariants, Docker's own compose
      # parser (skips if the docker CLI is absent), and the real-socket tests.

    - id: E-4
      kind: file-exists
      paths:
        - Dockerfile
        - docker-compose.yml
        - docker-compose.gpu.yml
        - .dockerignore
        - docker/healthcheck.py
        - requirements.lock
        - requirements-dev.lock
        - scripts/lock.sh
        - docs/DEPLOYMENT.md
        - src/panekmodel2/server/auth.py
        - tests/test_auth.py
        - tests/test_packaging.py

    - id: E-5
      kind: citation
      ref: "src/panekmodel2/server/auth.py:149"
      # PasswordGateMiddleware — raw ASGI above the router, so the "/" static
      # mount, docs routes and future routes are gated by construction. The
      # Basic-vs-session-cookie justification is in its docstring.

    - id: E-6
      kind: citation
      ref: "src/panekmodel2/server/auth.py:117"
      # require_auth_for_bind — the SEC-001 permanent fix: non-loopback bind
      # with no (or blank) password raises BindRefused; CLI exits 2.

    - id: E-7
      kind: citation
      ref: "src/panekmodel2/server/app.py:186"
      # serve() hands uvicorn the GATED app; pinned by the assertion at
      # tests/test_auth.py:502 after mutation M09 survived the inherited suite.

    - id: E-8
      kind: citation
      ref: "tests/test_packaging.py:509"
      # The CRITICAL from the brief: uvicorn at "trace", every logger captured,
      # Basic/Bearer/wrong credentials presented over a real socket; neither
      # the password nor its base64 may appear. Non-vacuous: requires the
      # access line and a trace ASGI record to have been captured, and was
      # separately shown to FAIL when auth.py logs the offered password.

    - id: E-9
      kind: citation
      ref: "docker-compose.yml:26"
      # ${THROUGHLINE_PASSWORD:?} — Compose refuses to start without it; pinned
      # through `docker compose config` at tests/test_packaging.py:120.

    - id: E-10
      kind: citation
      ref: "scripts/lock.sh:43"
      # pip-tools pinned to 7.4.1, with the reason (7.6.1 JSON-API URL bug).

    - id: E-11
      kind: human-attested
      claim: "The suite genuinely passes in a venv built purely from the lock. Executed on macOS/arm64, Python 3.12.0: `python3.12 -m venv .venv; .venv/bin/python -m pip install --require-hashes -r requirements-dev.lock` (exit 0); `.venv/bin/python -m pip install --no-deps --no-build-isolation -e .` (exit 0 — no-build-isolation so the setuptools build backend also came from the lock); `pip check` reported no broken requirements; `pip freeze --all --exclude-editable` compared against the lock's pins differed ONLY by `pip` itself (venv bootstrap). Then `pytest -m 'not slow'`: 548 passed, 0 failed, 0 skipped, 8 deselected."

    - id: E-12
      kind: human-attested
      claim: "Mutation testing of the enforcement: 25 mutations across auth.py, app.py, logging_redaction.py, cli.py, config.py, docker/healthcheck.py, Dockerfile and docker-compose.yml, each applied alone, verified applied (file bytes changed and new text present), full fast suite run, restored from the in-memory original and verified byte-identical; `git status` identical before and after. First pass against the inherited tests: 23 killed, 2 survived — M09 (serve() passing password=None to create_app: a genuinely open server on 0.0.0.0 with the password set — NOT equivalent, a real gap) and M11 (any auth scheme accepted as a raw password: not a bypass since the password is still required, but a contract break). Tests were added for both; final pass 25/25 killed. M20 (removing the empty-credential guard), which I predicted equivalent, was killed — without it a bare `Bearer` header raises AttributeError (a 500, not a 401); my prediction was wrong. Script: scratchpad dev-packaging2/mutate_packaging.py (not committed)."

    - id: E-13
      kind: human-attested
      claim: "pip-tools 7.6.1 (with pip 23.2.1 and with pip 26.2.1) computed the PyPI JSON-API URL as https://pypi.org/torch/json, which returns 404 (verified by calling PyPIRepository._get_project and session.get directly), so --generate-hashes fell back to downloading every candidate wheel to hash it; the pip-tools cache reached 22 GB of torch wheels before the run was killed. pip-tools 7.4.1 + pip 24.2 obtained all 24 torch 2.14.1 hashes from the JSON API and produced both locks in ~83 s. lock.sh refuses other pip-tools versions unless LOCK_ANY_PIP_TOOLS=1; that refusal was executed against 7.6.1 (exit 1)."

    - id: E-14
      kind: human-attested
      claim: "Docker Compose v2.34.0 (`docker compose config`, client-side; the daemon was NOT running and was not started) parsed docker-compose.yml alone and with docker-compose.gpu.yml: exit 1 with THROUGHLINE_PASSWORD unset or blank, exit 0 with a placeholder; resolved port host_ip 127.0.0.1; three named volumes at the expected targets; the GPU override only changes TORCH_INDEX_URL, CUDA and the device reservation. These checks are automated in tests/test_packaging.py (skipped where the docker CLI is absent)."

    - id: E-15
      kind: human-attested
      claim: "Inherited state verified at the commits, not trusted: ce23bb7 contained exactly the seven files described; replayed onto main@087b444 with no conflict (as 0557ccf). The dead worktree held uncommitted Dockerfile/compose/healthcheck/test_packaging/RUNBOOK/lock work; it was read only (never written). Salvaged and adapted: healthcheck.py verbatim; Dockerfile, compose, .dockerignore, lock.sh, tests and runbook rewritten to the brief (requirements.lock naming, separate named volumes with seeded ownership, DEPLOYMENT.md). Its README diff was NOT applied wholesale — it predates story-3d and would have reverted the granularity table."

    - id: E-16
      kind: fixture-provenance
      fixture: tests/test_packaging.py
      synthetic: true
      # No captured data: text assertions over the repo's own files, Docker's
      # parser over them, and a loopback uvicorn with the pipeline stubbed.

    - id: E-17
      kind: assumed
      claim: "IMAGE CONTENTS ARE UNVERIFIED — verification needs a Docker daemon, which was down and was not started. Never executed: `docker build`, the non-root user at runtime, volume ownership seeding, NLTK/HF downloads landing in the model volume, the in-container healthcheck, and the build-arg torch install. The Dockerfile tests check its TEXT (no secret named in any instruction, COPY allowlist, USER before CMD, mount points created with ownership); they cannot prove a layer is secret-free. No image was built, so none was published."

    - id: E-18
      kind: assumed
      claim: "UNTESTED-PENDING-RIG: the GPU override, the CUDA torch index, `scripts/lock.sh --docker` (hence any reproducible/pinned image), every Linux and WSL2 step, Tailscale, the systemd sketch, the backup/restore commands and the Apptainer notes. All are reasoned from documentation and source reading (e.g. NLTK's default_download_dir, Docker's volume-seeding rule), not executed."

    - id: E-19
      kind: assumed
      claim: "The committed locks are valid only for macOS/arm64 + Python 3.12. They will refuse (--require-hashes) on Linux; that refusal is reasoned from pip-tools' marker-based resolution (Linux-only nvidia-*/triton deps are absent), not executed on Linux. The default image therefore installs from pyproject floors and is not reproducible."

    - id: E-20
      kind: assumed
      claim: "The slow suite (8 tests, real model weights) was not run in the lock-built venv. The diff touches no pipeline/topic/sentiment code, but the lock does resolve newer library versions than the shared .venv (e.g. fastapi 0.142.2), so real-model behaviour under the locked versions is unverified."
