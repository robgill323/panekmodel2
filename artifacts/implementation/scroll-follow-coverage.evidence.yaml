      kind: test-run
      cmd: '.venv/bin/python -m pytest tests/test_follow_scroll.py -p no:randomly'
      expect: {exit: 0}
      cwd: "."

    - id: E-4
      kind: citation
      ref: "src/panekmodel2/server/static/follow.js:73"
      # shouldFollow — scrolling requires playing AND enabled. Highlighting is
